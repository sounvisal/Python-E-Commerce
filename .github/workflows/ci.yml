name: Luméa CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          cd python-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API and commerce regression tests
        env:
          PYTHONPATH: python-backend
          DATABASE_URL: sqlite:///${{ runner.temp }}/lumea-tests.sqlite
        run: |
          python -m pytest -v --tb=short python-backend/tests test_flow_regressions.py test_security_transactions.py

  frontend-build:
    name: Storefront Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Storefront SPA
        run: |
          cd frontend
          npm run build

      - name: Run storefront regression tests
        run: node --test frontend/tests/flows.test.mjs test_recommendations.mjs

  admin-build:
    name: Admin Console Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        run: |
          cd admin
          npm ci

      - name: Build Admin SPA
        run: |
          cd admin
          npm run build
